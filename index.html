<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кафедра ИС — расписание сейчас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E14;
    --panel:#131826;
    --row:#171D2C;
    --row-alt:#141a28;
    --grid-line:#232A3B;
    --text:#EDEFF5;
    --text-dim:#8890A2;
    --text-faint:#5B6376;
    --now:#FFB020;
    --lecture:#3E8EEF;   --lecture-dim:#1E3A5C;
    --practice:#33B27A;  --practice-dim:#1B3F30;
    --lab:#E0A73E;       --lab-dim:#4A3A16;
    --other:#8B8FA3;     --other-dim:#33374A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding:20px 24px 32px;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  .topbar{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:1px solid var(--grid-line); padding-bottom:14px; margin-bottom:14px;
    flex-wrap:wrap; gap:12px;
  }
  .brand .eyebrow{font-size:13px; color:var(--text-dim); letter-spacing:.02em; margin:0 0 2px;}
  .brand h1{font-size:26px; font-weight:600; margin:0; letter-spacing:-.01em;}
  .clockwrap{text-align:right;}
  .clock{font-size:38px; font-weight:700; line-height:1; letter-spacing:.02em;}
  .dateline{font-size:14px; color:var(--text-dim); margin-top:4px; display:flex; gap:8px; justify-content:flex-end; align-items:center;}
  .live-dot{width:8px; height:8px; border-radius:50%; background:var(--now); display:inline-block; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px;}
  .legend{display:flex; gap:16px; flex-wrap:wrap;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-dim);}
  .swatch{width:11px; height:11px; border-radius:2px;}
  .winbtns{display:flex; gap:10px; align-items:center;}
  .tzwrap{display:flex; align-items:center; gap:8px;}
  .tzwrap label{font-size:13px; color:var(--text-dim);}
  select.tzselect{
    background:var(--panel); border:1px solid var(--grid-line); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:13px; padding:5px 10px; border-radius:6px; cursor:pointer;
  }
  select.tzselect:focus{outline:1px solid var(--now);}
  .winbtn{
    background:transparent; border:1px solid var(--grid-line); color:var(--text-dim);
    font-family:'JetBrains Mono',monospace; font-size:13px; padding:5px 12px; border-radius:6px; cursor:pointer;
  }
  .winbtn.active{border-color:var(--now); color:var(--now);}

  .summary{font-size:14px; color:var(--text-dim); margin-bottom:14px;}
  .summary b{color:var(--text); font-weight:600;}

  .board{background:var(--panel); border:1px solid var(--grid-line); border-radius:10px; overflow:hidden;}
  .ruler{display:flex; border-bottom:1px solid var(--grid-line);}
  .ruler-label-col{width:150px; flex-shrink:0; border-right:1px solid var(--grid-line);}
  .ruler-track{position:relative; flex:1; height:34px;}
  .tick{position:absolute; top:0; bottom:0; border-left:1px solid var(--grid-line); font-size:12px; color:var(--text-faint); padding-left:6px; padding-top:8px; font-family:'JetBrains Mono',monospace;}

  .rows{position:relative;}
  .row{display:flex; border-bottom:1px solid var(--grid-line); min-height:56px;}
  .row:last-child{border-bottom:none;}
  .room-col{
    width:150px; flex-shrink:0; border-right:1px solid var(--grid-line);
    display:flex; align-items:center; padding:0 14px;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px;
  }
  .track{position:relative; flex:1;}
  .track .vline{position:absolute; top:0; bottom:0; border-left:1px solid var(--grid-line);}

  .block{
    position:absolute; top:6px; bottom:6px; border-radius:6px;
    border-left:4px solid; padding:6px 10px; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; justify-content:center; gap:2px;
    transition:filter .15s;
  }
  .block:hover{filter:brightness(1.15);}
  .block.selected{outline:2px solid var(--text);}
  .block .t-name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .block .t-sub{font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.85;}
  .block.type-lecture{background:var(--lecture-dim); border-color:var(--lecture);}
  .block.type-practice{background:var(--practice-dim); border-color:var(--practice);}
  .block.type-lab{background:var(--lab-dim); border-color:var(--lab);}
  .block.type-other{background:var(--other-dim); border-color:var(--other);}
  .block.online{border-style:dashed;}

  .nowline{position:absolute; top:0; bottom:0; width:0; border-left:2px solid var(--now); z-index:5; transition:left 20s linear;}
  .nowline .nowhead{
    position:absolute; top:-9px; left:-6px; width:12px; height:12px; border-radius:50%;
    background:var(--now);
  }
  .nowline .nowtag{
    position:absolute; top:-30px; left:-24px; background:var(--now); color:#241600;
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
    padding:2px 6px; border-radius:4px; white-space:nowrap;
  }

  .detail{
    margin-top:16px; background:var(--panel); border:1px solid var(--grid-line); border-radius:10px;
    padding:16px 18px; display:none;
  }
  .detail.show{display:block;}
  .detail-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .detail-room{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700;}
  .detail-time{font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--text-dim);}
  .detail-subject{font-size:17px; font-weight:600; margin:10px 0 4px;}
  .detail-meta{font-size:14px; color:var(--text-dim); line-height:1.6;}
  .badge{display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:5px; margin-right:8px;}
  .badge.type-lecture{background:var(--lecture-dim); color:var(--lecture);}
  .badge.type-practice{background:var(--practice-dim); color:var(--practice);}
  .badge.type-lab{background:var(--lab-dim); color:var(--lab);}
  .badge.type-other{background:var(--other-dim); color:var(--other);}

  .empty-state{padding:60px 20px; text-align:center; color:var(--text-dim);}
  .empty-state .big{font-size:20px; color:var(--text); font-weight:600; margin-bottom:6px;}
</style>
</head>

const RU_DAYS = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const EN_TO_IDX = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
const REFRESH_MS = 15000;

let windowHours = 4;
let selectedKey = null;
let selectedTz = "Asia/Almaty";

function getZoned(tz){
  const now = new Date();
  if(tz === "local"){
    return {
      hour: now.getHours(), minute: now.getMinutes(), second: now.getSeconds(),
      dayName: RU_DAYS[now.getDay()],
      dateStr: now.toLocaleDateString("ru-RU", {day:"numeric", month:"long", year:"numeric"})
    };
  }
  const dtf = new Intl.DateTimeFormat("en-US", {timeZone:tz, hour12:false, hour:"2-digit", minute:"2-digit", second:"2-digit", weekday:"short"});
  const parts = dtf.formatToParts(now);
  const get = t => parts.find(p=>p.type===t).value;
  const hour = parseInt(get("hour"),10) % 24;
  const minute = parseInt(get("minute"),10);
  const second = parseInt(get("second"),10);
  const idx = EN_TO_IDX[get("weekday")];
  const dateStr = now.toLocaleDateString("ru-RU", {timeZone:tz, day:"numeric", month:"long", year:"numeric"});
  return {hour, minute, second, dayName: RU_DAYS[idx], dateStr};
}

function pad(n){ return String(n).padStart(2,"0"); }

function typeClass(t){
  if(t === "Лекция") return "type-lecture";
  if(t === "Практика") return "type-practice";
  if(t === "Лабораторная") return "type-lab";
  return "type-other";
}

function roomSortKey(r){
  const m = r.match(/^([0-9]+)/);
  return m ? [0, parseInt(m[1],10), r] : [1, 0, r];
}

function minutesToLabel(mins){
  mins = Math.round(mins);
  const h = Math.floor(mins/60), m = mins%60;
  return pad(h)+":"+pad(m);
}

function lessonKey(l){
  return l.teacher+"|"+l.day+"|"+l.start+"|"+l.room;
}

function render(){
  const z = getZoned(selectedTz);
  document.getElementById("clock").textContent =
    pad(z.hour)+":"+pad(z.minute)+":"+pad(z.second);
  const todayName = z.dayName;
  document.getElementById("dateline").textContent = todayName + " · " + z.dateStr;

  const nowMin = z.hour*60 + z.minute + z.second/60;
  const todays = LESSONS.filter(l => l.day === todayName);

  const boardwrap = document.getElementById("boardwrap");
  const summary = document.getElementById("summary");

  if(todays.length === 0){
    boardwrap.innerHTML = emptyState(
      "Сегодня, " + todayName.toLowerCase() + ", занятий по кафедре ИС нет",
      "Расписание рабочее с понедельника по пятницу."
    );
    summary.textContent = "";
    document.getElementById("detail").classList.remove("show");
    return;
  }

  const winStart = nowMin - 10;
  const winEnd = winStart + windowHours*60;

  let visible = todays.filter(l => l.endMin > winStart && l.startMin < winEnd);

  if(visible.length === 0){
    const upcoming = todays.filter(l => l.startMin >= nowMin).sort((a,b)=>a.startMin-b.startMin)[0];
    if(upcoming){
      boardwrap.innerHTML = emptyState(
        "Сейчас занятий нет",
        "Ближайшее — в " + upcoming.start + ", ауд. " + upcoming.room + " (" + upcoming.discipline + ")"
      );
    } else {
      boardwrap.innerHTML = emptyState("На сегодня занятия закончились", "Следующие занятия — по расписанию другого дня.");
    }
    summary.textContent = "";
    document.getElementById("detail").classList.remove("show");
    return;
  }

  const rooms = Array.from(new Set(visible.map(l=>l.room))).sort((a,b)=>{
    const ka=roomSortKey(a), kb=roomSortKey(b);
    if(ka[0]!==kb[0]) return ka[0]-kb[0];
    if(ka[1]!==kb[1]) return ka[1]-kb[1];
    return ka[2].localeCompare(kb[2]);
  });

  const liveCount = visible.filter(l => l.startMin <= nowMin && l.endMin > nowMin).length;
  summary.innerHTML = "Сейчас идёт <b>"+liveCount+"</b> занят"+plural(liveCount)+" · показано окно <b>"+minutesToLabel(Math.max(winStart,0))+"–"+minutesToLabel(winEnd)+"</b> · "+rooms.length+" аудитори"+plural2(rooms.length);

  const span = winEnd - winStart;
  const ticks = [];
  let t0 = Math.ceil(winStart/30)*30;
  for(let t=t0; t<=winEnd; t+=30){
    ticks.push(t);
  }

  const rulerTicks = ticks.map(t=>{
    const pct = (t-winStart)/span*100;
    return '<div class="tick" style="left:'+pct.toFixed(2)+'%">'+minutesToLabel(t)+'</div>';
  }).join("");

  const rowsHtml = rooms.map(room=>{
    const lessonsInRoom = visible.filter(l=>l.room===room);
    const blocks = lessonsInRoom.map(l=>{
      let left = (l.startMin-winStart)/span*100;
      let right = (l.endMin-winStart)/span*100;
      left = Math.max(0,left); right = Math.min(100,right);
      const width = Math.max(right-left, 2);
      const key = lessonKey(l);
      const cls = typeClass(l.type) + (l.online ? " online" : "") + (key===selectedKey ? " selected" : "");
      const shortTeacher = l.teacher.split(" ").slice(0,2).join(" ");
      return '<div class="block '+cls+'" data-key="'+encodeURIComponent(key)+'" style="left:'+left.toFixed(2)+'%;width:'+width.toFixed(2)+'%">'
        +'<div class="t-name">'+escapeHtml(shortTeacher)+'</div>'
        +'<div class="t-sub">'+escapeHtml(l.discipline)+'</div>'
        +'</div>';
    }).join("");
    return '<div class="row"><div class="room-col">'+escapeHtml(room)+'</div><div class="track">'+vlines(ticks,winStart,span)+blocks+'</div></div>';
  }).join("");

  let nowLineHtml = "";
  if(nowMin >= winStart && nowMin <= winEnd){
    const pct = (nowMin-winStart)/span*100;
    nowLineHtml = '<div class="nowline" id="nowline" style="left:'+pct.toFixed(2)+'%">'
      +'<div class="nowhead"></div><div class="nowtag">'+pad(z.hour)+":"+pad(z.minute)+'</div></div>';
  }

  boardwrap.innerHTML =
    '<div class="board">'
    +'<div class="ruler"><div class="ruler-label-col"></div><div class="ruler-track">'+rulerTicks+'</div></div>'
    +'<div class="rows" style="position:relative">'+rowsHtml+nowLineOverlay(nowLineHtml)+'</div>'
    +'</div>';

  document.querySelectorAll(".block").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = decodeURIComponent(el.getAttribute("data-key"));
      selectedKey = (selectedKey===key) ? null : key;
      const lesson = visible.find(l=>lessonKey(l)===key);
      if(selectedKey && lesson){ showDetail(lesson); } else { document.getElementById("detail").classList.remove("show"); }
      render();
    });
  });
}

function nowLineOverlay(html){
  if(!html) return "";
  return '<div style="position:absolute; top:0; left:150px; right:0; bottom:0; pointer-events:none;">'+html+'</div>';
}

function vlines(ticks, winStart, span){
  return ticks.map(t=>{
    const pct=(t-winStart)/span*100;
    return '<div class="vline" style="left:'+pct.toFixed(2)+'%"></div>';
  }).join("");
}

function showDetail(l){
  const d = document.getElementById("detail");
  d.classList.add("show");
  d.innerHTML =
    '<div class="detail-top">'
    +'<div><div class="detail-room mono">'+escapeHtml(l.room)+'</div></div>'
    +'<div class="detail-time mono">'+l.start+'–'+l.end+' · '+escapeHtml(l.day)+'</div>'
    +'</div>'
    +'<div class="detail-subject">'+escapeHtml(l.discipline)+'</div>'
    +'<div class="detail-meta">'
    +'<span class="badge '+typeClass(l.type)+'">'+escapeHtml(l.type)+(l.online?" · онлайн":"")+'</span>'
    +escapeHtml(l.teacher)+'<br>'
    +escapeHtml(l.group)+' · '+escapeHtml(l.level)
    +'</div>';
}

function emptyState(big, small){
  return '<div class="board"><div class="empty-state"><div class="big">'+escapeHtml(big)+'</div><div>'+escapeHtml(small)+'</div></div></div>';
}

function plural(n){
  const m = n%10, m2=n%100;
  if(m2>=11 && m2<=14) return "ий";
  if(m===1) return "ие";
  if(m>=2 && m<=4) return "ия";
  return "ий";
}
function plural2(n){
  const m = n%10, m2=n%100;
  if(m2>=11 && m2<=14) return "й";
  if(m===1) return "я";
  if(m>=2 && m<=4) return "и";
  return "й";
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("winbtns").addEventListener("click", (e)=>{
  const btn = e.target.closest(".winbtn");
  if(!btn) return;
  windowHours = parseInt(btn.getAttribute("data-h"),10);
  document.querySelectorAll(".winbtn").forEach(b=>b.classList.toggle("active", b===btn));
  render();
});
document.querySelector('.winbtn[data-h="4"]').classList.add("active");

document.getElementById("tzSelect").addEventListener("change", (e)=>{
  selectedTz = e.target.value;
  render();
});

render();
setInterval(render, REFRESH_MS);
setInterval(()=>{
  const z = getZoned(selectedTz);
  const c = document.getElementById("clock");
  if(c) c.textContent = pad(z.hour)+":"+pad(z.minute)+":"+pad(z.second);
}, 1000);

</script>
